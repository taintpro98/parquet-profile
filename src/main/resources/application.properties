# Defaults match the local Oracle in docker-compose.yml.
# Set real credentials through ORACLE_URL, ORACLE_USERNAME, ORACLE_PASSWORD.
oracle.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
oracle.username=benchmark
oracle.password=benchmark
oracle.table=ARCHIVE_PROFILE_DATA
# Replaces the generated SELECT when set. It must return the same columns in REFERENCE order.
oracle.query=
# Reads the whole table this many times into one file, 1 to 9999. See README.
oracle.repeat=1
oracle.fetch-size=1000
oracle.text-columns=70

parquet.output=data/transactions.parquet
parquet.compression=ZSTD
# A row group is flushed when EITHER limit is reached.
parquet.row-group-rows=250000
parquet.row-group-bytes=2147483648

progress.interval=500000

# FIND memory. Fewer threads and no file cache lower Peak Process RAM; see README.
duckdb.threads=4
duckdb.external-file-cache=false
