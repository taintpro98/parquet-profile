# Local Oracle for smoke-testing only. Benchmark numbers should come from the real environment.
# Datafiles live in ./data/oracle on the host. make seed fills it, make seed-clean deletes it.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: parquet-profile-oracle
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_RANDOM_PASSWORD: "yes"
      APP_USER: benchmark
      APP_USER_PASSWORD: benchmark
    volumes:
      - ./data/oracle:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
